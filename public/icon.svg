<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="104" fill="none" stroke="#6366f1" stroke-width="6" opacity="0.4" />

  <!-- Background card (ManaBox style) tilted left -->
  <g transform="translate(160, 240) rotate(-14)">
    <rect x="-70" y="-105" width="140" height="210" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="6" opacity="0.9" />
    <rect x="-56" y="-91" width="112" height="70" rx="6" fill="#0f172a" opacity="0.8" />
    <circle cx="0" cy="-56" r="16" fill="#38bdf8" opacity="0.6" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.7" />
    <line x1="-50" y1="20" x2="30" y2="20" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.5" />
    <line x1="-50" y1="40" x2="40" y2="40" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.5" />
    <rect x="-52" y="66" width="36" height="18" rx="4" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Foreground card (LigaMagic style) tilted right -->
  <g transform="translate(340, 260) rotate(10)" filter="url(#glow)">
    <rect x="-76" y="-115" width="152" height="230" rx="16" fill="#1e1b4b" stroke="url(#goldGrad)" stroke-width="7" />
    <rect x="-62" y="-101" width="124" height="78" rx="8" fill="#0f172a" />
    <polygon points="0,-82 14,-50 -14,-50" fill="#fbbf24" opacity="0.9" />
    <circle cx="0" cy="-62" r="6" fill="#fff" />
    <line x1="-54" y1="-4" x2="54" y2="-4" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
    <line x1="-54" y1="20" x2="30" y2="20" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    <line x1="-54" y1="42" x2="44" y2="42" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    <rect x="-54" y="68" width="56" height="22" rx="4" fill="#f59e0b" />
    <text x="-26" y="84" fill="#0f172a" font-size="13" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">LIGA</text>
  </g>

  <!-- Transformation arrow / Mana spark in the center -->
  <g transform="translate(244, 240)">
    <circle cx="12" cy="12" r="32" fill="#0f172a" stroke="#fbbf24" stroke-width="4" filter="url(#glow)" />
    <!-- Arrow -->
    <path d="M-2,12 L20,12 M12,4 L22,12 L12,20" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Header Mana gems / dots -->
  <g transform="translate(256, 88)">
    <circle cx="-50" cy="0" r="10" fill="#f87171" opacity="0.9" />
    <circle cx="-25" cy="0" r="10" fill="#60a5fa" opacity="0.9" />
    <circle cx="0" cy="0" r="10" fill="#a78bfa" opacity="0.9" />
    <circle cx="25" cy="0" r="10" fill="#34d399" opacity="0.9" />
    <circle cx="50" cy="0" r="10" fill="#fbbf24" opacity="0.9" />
  </g>

  <!-- Bottom label -->
  <text x="256" y="440" fill="#f8fafc" font-size="28" font-weight="800" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="3">MANABOX → LIGA</text>
</svg>
